name: Publish pilot APK to release

on:
  push:
    branches:
      - arena/01a0ba39-learn-english
    paths:
      - .github/workflows/pilot-apk-release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the APK to
        required: true
        default: v1.0.0-pilot.1

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pilot source commit
        uses: actions/checkout@v4
        with:
          ref: 299f49641c7719dd6de1e8dc3f2497bcecdd9e51

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK
        run: npm run apk:debug

      - name: Verify APK signature
        run: npm run apk:verify

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag || 'v1.0.0-pilot.1' }}" artifacts/Lexora-1.0.0-debug.apk --clobber --repo "$GITHUB_REPOSITORY"
